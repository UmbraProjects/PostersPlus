# Keeps the commit-pinned actions, the digest-pinned base image and the Python packages current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # requirements.txt pins each package below its next major and every build
    # already takes the newest release in range, so raising a lower bound is
    # noise: only a release the range shuts out (a new major) gets a PR.
    versioning-strategy: increase-if-necessary
