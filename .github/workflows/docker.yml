name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
      - '.env.example'
      - '.devcontainer/**'
      - 'discovery_overrides.example.json'
      - '.github/**'
      - 'Showcase/**'
  # Manual trigger from the Actions tab — useful for re-publishing :latest (built from dev)
  # after a registry-state hiccup, or when paths-ignore swallowed a push
  # that you actually want rebuilt.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/umbraprojects/postersplus
          # Disable the metadata-action's automatic :latest behaviour — its
          # default (latest=auto) adds :latest to every semver tag push, so
          # parallel v1.0.0 / v1.0.1 / v1.0.2 builds race to claim it and
          # the last one to finish wins (which is rarely the highest version).
          # The explicit type=raw rule below owns :latest exclusively now.
          flavor: |
            latest=false
          tags: |
            # dev branch → :latest (and :dev below)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            # branch push → :<branch-name> (main, dev)
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            # version tag (v1.2.3) → :1.2.3, :1.2, :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
